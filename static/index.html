<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>砺行 · 砥砺日省，知行合一</title>
  <link rel="icon" href="/brand/app-logo-mark.svg" type="image/svg+xml" />
  <style>
    @font-face {
      font-family: "LiFix";
      src: url("assets/fonts/LixingFix.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "GuoWen ZhengKai";
      src: url("assets/fonts/LixingFix.ttf") format("truetype");
      unicode-range: U+783A-783B;
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "GuoWen ZhengKai";
      src: url("assets/fonts/KaiOldstyle.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    .char-li { font-family: "LiFix", "KaiTi", "STKaiti", serif; }

    html, body, button, input, textarea, select {
      font-family: var(--font);
    }


    :root {
      --ink: #1a1a1a;
      --ink-soft: #333;
      --muted: #666;
      --line: #c93756;
      --line-deep: #a82845;
      --line-soft: rgba(201, 55, 86, 0.28);
      --bg: #e8e0d0;
      --bg-deep: #ddd4c4;
      --surface: #fcf9f2;
      --paper: #fcf9f2;
      --paper-warm: #f9f4e8;
      --accent: #1a1a1a;
      --accent-warm: #c93756;
      --accent-soft: #fff8f5;
      --good: #0f766e;
      --mid: #b45309;
      --bad: #b91c1c;
      --nav-h: 52px;
      --font: "GuoWen ZhengKai", "KaiTi", "STKaiti", serif;
      --display: "GuoWen ZhengKai", "KaiTi", "STKaiti", serif;
      --song: "GuoWen ZhengKai", "KaiTi", "STKaiti", serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: #120e0b;
      color: var(--ink);
      line-height: 1.65;
      font-size: 15px;
      min-height: 100vh;
    }
    body.auth-pending .auth-gated { display: none !important; }

    /* —— 古籍书房 · mxai 线装书 —— */
    .notebook-page {
      max-width: none;
      margin: 0;
      padding: 0 0 28px;
      min-height: calc(100vh - var(--nav-h));
    }
    .study-scene {
      position: relative;
      min-height: calc(100vh - var(--nav-h));
      overflow: hidden;
    }
    .study-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      z-index: 0;
      filter: brightness(0.72) saturate(0.95);
    }
    .study-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, transparent 30%, rgba(8,6,4,0.55) 100%),
        linear-gradient(180deg, rgba(8,6,4,0.25) 0%, transparent 18%, transparent 78%, rgba(8,6,4,0.55) 100%);
    }
    .study-scene > .ask-stage,
    .study-scene > .open-hero {
      position: relative;
      z-index: 2;
    }

    .ask-stage {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 6vw 56px;
    }
    .cover-hero { display: none; }
    .ask-copy {
      color: #f3ead8;
      text-align: center;
      max-width: min(480px, 92vw);
    }
    .ask-kicker {
      font-size: 0.78rem;
      letter-spacing: 0.5em;
      color: #c4b08a;
      margin: 0 0 18px;
    }
    .ask-line {
      margin: 0;
      font-size: clamp(1.2rem, 2.6vw, 1.7rem);
      letter-spacing: 0.22em;
      line-height: 1.75;
      color: #f6f0e4;
    }
    .ask-line--q { font-size: clamp(1.25rem, 2.8vw, 1.9rem); margin-top: 8px; }
    .ask-begin {
      margin-top: 28px;
      font-family: var(--font);
      font-size: 0.92rem;
      letter-spacing: 0.42em;
      background: transparent;
      border: 1px solid #f3ead8;
      color: #f3ead8;
      padding: 10px 28px;
      cursor: pointer;
    }
    .ask-begin:hover { background: #f3ead8; color: #1a120c; }
    .ask-kicker, .ask-line, .ask-begin {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(16px);
      transition: opacity 1s cubic-bezier(.25,.1,.25,1), filter 1.1s cubic-bezier(.25,.1,.25,1), transform 1s cubic-bezier(.25,.1,.25,1), background .2s, color .2s;
    }
    .ask-stage.is-ready .ask-kicker,
    .ask-stage.is-ready .ask-line,
    .ask-stage.is-ready .ask-begin {
      opacity: 1;
      filter: none;
      transform: none;
    }
    .ask-stage.is-ready .ask-kicker { transition-delay: .12s; }
    .ask-stage.is-ready .ask-line:nth-of-type(2) { transition-delay: .32s; }
    .ask-stage.is-ready .ask-line:nth-of-type(3) { transition-delay: .52s; }
    .ask-stage.is-ready .ask-line--q { transition-delay: .76s; }
    .ask-stage.is-ready .ask-begin { transition-delay: 1.05s; }
    .ask-stage.is-out {
      opacity: 0;
      filter: blur(16px);
      transform: scale(0.98);
      pointer-events: none;
      transition: 0.7s cubic-bezier(.25,.1,.25,1);
    }

    .open-hero {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 4vw 88px;
      opacity: 0;
      filter: blur(14px);
      transform: translateY(18px) scale(0.985);
      transition: opacity .95s cubic-bezier(.25,.1,.25,1), filter 1.1s cubic-bezier(.25,.1,.25,1), transform .95s cubic-bezier(.25,.1,.25,1);
    }
    .open-hero.is-in {
      opacity: 1;
      filter: none;
      transform: none;
    }
    .write-surface {
      position: relative;
      width: min(920px, 96vw);
      color: #f3ead8;
    }
    .write-date-box {
      position: absolute;
      top: 0;
      right: 0;
      border: 1px solid rgba(185, 28, 28, 0.75);
      background: transparent;
      padding: 6px 12px;
      z-index: 2;
    }
    .write-date {
      margin: 0;
      font-family: var(--font);
      font-size: clamp(0.58rem, 1vw, 0.72rem);
      letter-spacing: 0.06em;
      line-height: 1.45;
      text-align: center;
      color: #e8dcc4;
    }
    .write-header {
      padding-right: 11em;
      margin-bottom: 18px;
    }
    .write-title {
      margin: 0 0 10px;
      font-family: var(--display);
      font-size: clamp(1.15rem, 2.4vw, 1.55rem);
      font-weight: normal;
      letter-spacing: 0.28em;
      color: #f6f0e4;
    }
    .write-wish-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      color: #c4b08a;
    }
    .write-wish-row label { flex-shrink: 0; }
    .write-wish-row input {
      flex: 1;
      min-width: 12em;
      border: none;
      border-bottom: 1px solid rgba(243, 234, 216, 0.35);
      background: transparent;
      color: #f3ead8;
      font-family: var(--font);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      padding: 4px 0;
      outline: none;
    }
    .write-wish-row input::placeholder { color: rgba(196, 176, 138, 0.55); }
    .write-wish-foot {
      font-size: 0.72rem;
      color: rgba(196, 176, 138, 0.7);
    }
    .write-three-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .write-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 12px 12px;
      background: transparent;
      border: none;
      border-top: 1px solid rgba(243, 234, 216, 0.28);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .75s cubic-bezier(.25,.1,.25,1), transform .75s cubic-bezier(.25,.1,.25,1), filter .5s;
    }
    .open-hero.is-in .write-card { opacity: 1; transform: none; }
    .open-hero.is-in .write-three-grid .write-card:nth-child(1) { transition-delay: .08s; }
    .open-hero.is-in .write-three-grid .write-card:nth-child(2) { transition-delay: .2s; }
    .open-hero.is-in .write-three-grid .write-card:nth-child(3) { transition-delay: .32s; }
    .write-card.is-wait {
      opacity: 0.25 !important;
      filter: blur(2px);
      pointer-events: none;
    }
    .write-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .write-meta {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      color: #c4b08a;
    }
    .write-kw {
      font-family: var(--display);
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      min-width: 2.2em;
      text-align: center;
      margin: 0;
      outline: none;
      color: #faf6ee;
      filter: blur(5px);
      opacity: 0.35;
      transition: filter .6s, opacity .6s;
      cursor: text;
    }
    .write-kw:empty::before {
      content: attr(data-placeholder);
      color: rgba(196, 176, 138, 0.45);
    }
    .write-card.has-kw .write-kw { filter: none; opacity: 1; }
    .write-card textarea {
      width: 100%;
      min-height: 76px;
      border: none;
      border-top: 1px solid rgba(243, 234, 216, 0.12);
      background: transparent;
      resize: vertical;
      outline: none;
      font-family: var(--font);
      font-size: 0.92rem;
      line-height: 1.65;
      letter-spacing: 0.06em;
      color: #f6f0e4;
      padding: 8px 0 4px;
    }
    .write-card textarea::placeholder { color: rgba(196, 176, 138, 0.5); }
    .write-foot {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: rgba(196, 176, 138, 0.75);
    }
    .write-card.has-kw .write-foot { color: #e8a0a0; }
    .write-feel {
      padding: 12px 2px 8px;
      background: transparent;
      border: none;
      border-top: 1px dashed rgba(243, 234, 216, 0.22);
      margin-bottom: 12px;
    }
    .write-feel-label {
      margin: 0 0 8px;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      color: #b8a48a;
    }
    .write-feel-label em {
      font-style: normal;
      font-size: 0.72rem;
      color: rgba(196, 176, 138, 0.65);
    }
    .write-feel textarea {
      width: 100%;
      min-height: 52px;
      border: none;
      border-bottom: 1px solid rgba(243, 234, 216, 0.2);
      background: transparent;
      resize: vertical;
      outline: none;
      font-family: var(--font);
      font-size: 0.86rem;
      line-height: 1.6;
      color: #ebe3d4;
      padding: 4px 0;
    }
    .write-feel textarea::placeholder { color: rgba(196, 176, 138, 0.45); }
    .write-feel.has-feel { border-color: rgba(243, 234, 216, 0.28); }
    .write-feel-foot {
      margin: 6px 0 0;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: rgba(196, 176, 138, 0.65);
    }
    .review-circle {
      flex-shrink: 0;
      width: 1.5em;
      height: 1.5em;
      pointer-events: none;
      opacity: 0;
      background: center/contain no-repeat;
      transition: opacity .35s ease;
    }
    .review-circle.is-yes {
      opacity: 1;
      background-image: url("assets/notebook/red-circle.png");
    }
    .review-circle.is-no {
      opacity: 1;
      color: #b91c1c;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .review-circle.is-no::before { content: "批"; }
    .review-btns {
      display: none;
      flex-direction: row;
      gap: 6px;
    }
    .open-hero.is-review .write-card .review-btns { display: flex; }
    .review-btns button {
      font-family: var(--font);
      background: transparent;
      border: 1px solid rgba(185, 28, 28, 0.55);
      color: #e8a0a0;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
    }
    .review-btns button.is-active {
      background: rgba(185, 28, 28, 0.18);
      border-color: #b91c1c;
    }
    .review-strip {
      display: none;
      padding-top: 10px;
      border-top: 1px dashed rgba(185, 28, 28, 0.35);
    }
    .open-hero.is-review .review-strip { display: block; }
    .review-hint {
      margin: 0 0 8px;
      font-size: 0.76rem;
      letter-spacing: 0.14em;
      color: #e8a0a0;
    }
    .review-note {
      width: 100%;
      min-height: 2.8em;
      border: none;
      border-bottom: 1px solid rgba(185, 28, 28, 0.45);
      background: transparent;
      outline: none;
      font-family: var(--font);
      font-size: 0.88rem;
      color: #e8a0a0;
      letter-spacing: 0.08em;
      resize: vertical;
      padding: 4px 0;
    }
    .review-note::placeholder { color: rgba(185, 28, 28, 0.45); }
    .feeling-nudge {
      display: none;
      margin: 0 0 6px;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: #e8a0a0;
    }
    .feeling-nudge.is-show { display: block; }
    .open-hero.is-review .write-feel:not(.has-feel) {
      outline: 1px dashed rgba(185, 28, 28, 0.45);
      outline-offset: 2px;
    }
    .notebook-foot .btn-review {
      font-family: var(--font);
      font-size: 0.88rem;
      letter-spacing: 0.28em;
      background: transparent;
      border: 1px solid #c4b08a;
      color: #e8dcc4;
      padding: 8px 16px;
      cursor: pointer;
    }
    .notebook-foot .btn-review:hover,
    .notebook-foot .btn-review.is-active {
      background: rgba(185, 28, 28, 0.15);
      border-color: #b91c1c;
      color: #f5d0d0;
    }
    @media (max-width: 860px) {
      .ask-stage { padding: 32px 16px 40px; min-height: auto; }
      .write-header { padding-right: 0; padding-top: 44px; }
      .write-date-box { top: 0; right: 0; }
      .write-three-grid { grid-template-columns: 1fr; gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cover-hero, .cover-smoke, .ask-kicker, .ask-line, .ask-begin, .ask-stage.is-out, .open-hero, .write-card, .write-kw {
        animation: none !important;
        transition: none !important;
        filter: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }

    .notebook-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 0;
      padding: 8px 16px 20px;
      font-family: var(--font);
      color: #d8cbb6;
      position: relative;
      z-index: 3;
    }
    .notebook-foot .btn-save {
      font-family: var(--font);
      font-size: 0.92rem;
      letter-spacing: 0.25em;
      background: transparent;
      border: 1px solid #d8cbb6;
      color: #f3ead8;
      padding: 8px 24px;
      cursor: pointer;
      border-radius: 0;
    }
    .notebook-foot .btn-save:hover {
      background: #f3ead8;
      color: #1a120c;
    }
    .notebook-foot .saved-toast { font-size: 0.82rem; color: #c4b08a; }
    .notebook-foot .tool-link {
      font-family: var(--font);
      font-size: 0.82rem;
      color: #c4b08a;
      text-decoration: none;
      border-bottom: 1px solid rgba(196,176,138,0.4);
    }
    .notebook-foot .tool-link:hover { color: #f3ead8; }
    .notebook-foot input[type="date"] {
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 0.82rem;
      color: #c4b08a;
      color-scheme: dark;
    }

    .topnav-auth { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topnav-login, .topnav-logout, #navUser {
      font-family: var(--song); font-size: 0.78rem; color: #d8cbb6;
      text-decoration: none; letter-spacing: 0.06em;
    }
    .topnav-login { border: 1px solid rgba(216,203,182,0.45); padding: 6px 12px; }
    a { color: inherit; }

    .topnav {
      position: sticky; top: 0; z-index: 40;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 28px;
      background: rgba(12, 10, 8, 0.78);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(243, 234, 216, 0.12);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; white-space: nowrap;
    }
    .brand-logo {
      width: 32px; height: 32px; flex-shrink: 0; display: block;
    }
    .brand-text { display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
    .brand-mark {
      font-family: var(--display);
      font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em;
      color: #f3ead8;
    }
    .brand-sub { font-size: 0.72rem; color: #c4b08a; letter-spacing: 0.08em; }
    .hero-mark {
      width: 48px; height: 48px; display: block; margin: 0 0 18px;
    }
    .topnav-links {
      display: flex; flex-wrap: wrap; gap: 4px 14px;
      font-size: 0.82rem; color: var(--muted);
    }
    .topnav-links a {
      text-decoration: none; padding: 6px 0;
      border-bottom: 1px solid transparent;
    }
    .topnav-links a:hover { color: var(--ink); border-bottom-color: var(--ink); }
    .topnav-cta {
      display: inline-flex; align-items: center;
      padding: 8px 14px; border-radius: 999px;
      background: var(--ink); color: #fff !important;
      font-size: 0.8rem; text-decoration: none; white-space: nowrap;
      border-bottom: none !important;
    }
    .topnav-cta:hover { filter: brightness(1.15); }

    .hero {
      max-width: 920px; margin: 0 auto;
      padding: 56px 24px 36px;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 14px; font-weight: 600;
    }
    .hero h1 {
      font-family: var(--display);
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      font-weight: 700; line-height: 1.25;
      margin: 0 0 16px; max-width: 16em;
      letter-spacing: 0.01em;
    }
    .hero-lead {
      font-size: 1.05rem; color: var(--ink-soft);
      max-width: 36em; margin: 0 0 28px;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 22px; border: none; border-radius: 999px;
      font: inherit; font-size: 0.92rem; cursor: pointer;
      background: var(--ink); color: #fff;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.12); }
    .btn-ghost {
      background: transparent; color: var(--ink);
      border: 1px solid var(--ink); padding: 11px 20px; font-size: 0.88rem;
    }
    .btn-ghost:hover { background: rgba(17,17,17,0.04); filter: none; color: var(--ink); }
    .btn-danger {
      background: transparent; color: var(--bad);
      border: 1px solid var(--line); padding: 4px 10px; font-size: 0.78rem; border-radius: 8px;
    }

    .path-section {
      max-width: 920px; margin: 0 auto;
      padding: 8px 24px 48px;
    }
    .auth-gated {
      background: var(--paper);
      color: var(--ink);
    }
    .section-kicker {
      font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; margin: 0 0 8px;
    }
    .section-title {
      font-family: var(--display);
      font-size: clamp(1.35rem, 2.5vw, 1.75rem);
      margin: 0 0 8px; font-weight: 700;
    }
    .section-desc { color: var(--muted); margin: 0 0 22px; max-width: 40em; font-size: 0.95rem; }

    .philosophy {
      max-width: 920px; margin: 0 auto 8px;
      padding: 0 24px 32px;
    }
    .philosophy-inner {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
      color: var(--ink-soft);
      font-size: 0.95rem;
      line-height: 1.75;
    }
    .philosophy-inner strong { color: var(--ink); font-weight: 650; }
    .philosophy-inner p { margin: 0 0 12px; }
    .philosophy-inner p:last-child { margin-bottom: 0; }

    .pillar-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    @media (max-width: 820px) { .pillar-grid { grid-template-columns: 1fr; } }
    .pillar-card {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 20px 20px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
      font: inherit; color: inherit; width: 100%;
    }

  <script>
    const STORAGE_KEY = "life-density-v3";
    const OLD_KEYS = ["life-density-v2", "life-density-v1"];
    const BACKUP_KEY = "life-density-v3-autobackup";
    const HISTORY_KEY = "life-density-v3-history";
    const PREF_KEY = "life-density-prefs";
    const AUTO_FILE_NAME = "lixing-autobackup.json";
    const IDB_NAME = "life-density-fs";
    const IDB_STORE = "handles";

    let _backupFileHandle = null;
    let _diskBackupTimer = null;
    let _lastDiskBackupAt = null;

    function emptyState() {
      return {
        entries: {}, opinions: [], industries: [], rationals: [], samplings: [],
        reflections: [], penetrations: [], dualCards: [], biasSpots: {}, leonMarks: {},
        wheel: { scores: {}, note: "" }, wheelSnaps: [],
        kpi: { scores: {}, niche: "", audience: "", whyMe: "", pitch30: "", pitch3: "", pitch12: "",
          actPitch: "", actPublish: "", actProduct: "", actProfile: "", actPartner: "", note: "" },
        kpiSnaps: [],
        lifeWishes: {
          wishes: ["", "", ""], quizAnswers: ["", "", ""], completedAt: "",
          wishesLockedAt: "", wishesUnlockAt: "", yearlyReviews: [],
          sixMonth: { lines: ["", "", ""], lockedAt: "" },
        },
        decisions: [],
        indSteps: {}, settings: {},
      };
    }

    function todayStr() {
      const d = new Date();
      return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
      );
    }
    function nowIso() { return new Date().toISOString(); }
    function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

    function downloadBlob(filename, blob) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function getPrefs() {
      try {
        return Object.assign({ autoDownloadBackup: false }, JSON.parse(localStorage.getItem(PREF_KEY) || "{}"));
      } catch { return { autoDownloadBackup: false }; }
    }
    function setPrefs(patch) {
      const next = Object.assign(getPrefs(), patch);
      localStorage.setItem(PREF_KEY, JSON.stringify(next));
      return next;
    }

    function normalizeState(s) {
      const base = emptyState();
      if (!s || typeof s !== "object") return base;
      return {
        entries: s.entries && typeof s.entries === "object" ? s.entries : {},
        opinions: Array.isArray(s.opinions) ? s.opinions : [],
        industries: Array.isArray(s.industries) ? s.industries : [],
        rationals: Array.isArray(s.rationals) ? s.rationals : [],
        samplings: Array.isArray(s.samplings) ? s.samplings : [],
        reflections: Array.isArray(s.reflections) ? s.reflections : [],
        penetrations: Array.isArray(s.penetrations) ? s.penetrations : [],
        dualCards: Array.isArray(s.dualCards) ? s.dualCards : [],
        biasSpots: s.biasSpots && typeof s.biasSpots === "object" ? s.biasSpots : {},
        leonMarks: s.leonMarks && typeof s.leonMarks === "object" ? s.leonMarks : {},
        wheel: s.wheel && typeof s.wheel === "object" ? s.wheel : { scores: {}, note: "" },
        wheelSnaps: Array.isArray(s.wheelSnaps) ? s.wheelSnaps : [],
        kpi: s.kpi && typeof s.kpi === "object" ? s.kpi : emptyState().kpi,
        kpiSnaps: Array.isArray(s.kpiSnaps) ? s.kpiSnaps : [],
        lifeWishes: window.LixingV1
          ? window.LixingV1.normalizeLifeWishes(s.lifeWishes)
          : (s.lifeWishes && typeof s.lifeWishes === "object" ? s.lifeWishes : emptyState().lifeWishes),
        decisions: Array.isArray(s.decisions) ? s.decisions : [],
        indSteps: s.indSteps && typeof s.indSteps === "object" ? s.indSteps : {},
        settings: s.settings && typeof s.settings === "object" ? s.settings : {},
      };
    }

    function stateHasData(s) {
      const n = normalizeState(s);
      return Object.keys(n.entries).length
        + n.opinions.length + n.industries.length + n.rationals.length
        + n.samplings.length + n.reflections.length + n.penetrations.length
        + n.dualCards.length + Object.keys(n.biasSpots).length
        + Object.keys(n.leonMarks).length + (n.wheelSnaps || []).length
        + (n.kpiSnaps || []).length
        + Object.values((n.wheel && n.wheel.scores) || {}).filter((v) => Number(v) > 0).length
        + Object.values((n.kpi && n.kpi.scores) || {}).filter((v) => Number(v) > 0).length
        + [n.kpi && n.kpi.niche, n.kpi && n.kpi.pitch30].filter((x) => x && String(x).trim()).length > 0;
    }

    function buildBackupPayload(state) {
      const data = normalizeState(state);
      return {
        app: "lixing-rixing",
        version: 3,
        exportedAt: nowIso(),
        storageKey: STORAGE_KEY,
        auto: true,
        data,
      };
    }

    function openIdb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key) {
      try {
        const db = await openIdb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, "readonly");
          const r = tx.objectStore(IDB_STORE).get(key);
          r.onsuccess = () => resolve(r.result || null);
          r.onerror = () => reject(r.error);
        });
      } catch { return null; }
    }

    async function idbSet(key, value) {
      const db = await openIdb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key) {
      const db = await openIdb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function supportsFileBinding() {
      return typeof window.showSaveFilePicker === "function";
    }

    async function writeBoundBackupFile(payload) {
      if (!_backupFileHandle) return false;
      try {
        if (_backupFileHandle.queryPermission) {
          let perm = await _backupFileHandle.queryPermission({ mode: "readwrite" });
          if (perm !== "granted" && _backupFileHandle.requestPermission) {
            perm = await _backupFileHandle.requestPermission({ mode: "readwrite" });
          }
          if (perm !== "granted") return false;
        }
        const writable = await _backupFileHandle.createWritable();
        await writable.write(JSON.stringify(payload, null, 2));
        await writable.close();
        return true;
      } catch (e) {
        console.warn("绑定文件写入失败", e);
        return false;
      }
    }

    function updateAutoBackupStatus(extra) {
      const el = document.getElementById("autoBackupStatus");
      if (!el) return;
      const parts = [];
      if (_lastDiskBackupAt) {
        try {
          parts.push("上次文件备份：" + new Date(_lastDiskBackupAt).toLocaleString());
        } catch { parts.push("上次文件备份：" + _lastDiskBackupAt); }
      } else {
        parts.push("浏览器内备份已启用");
      }
      if (_backupFileHandle) parts.push("已绑定本地文件");
      if (extra) parts.push(extra);
      el.textContent = parts.join(" · ");
    }

    function canUseFolderBackupApi() {
      return location.protocol === "http:" || location.protocol === "https:";
    }

    async function writeFolderBackupViaServer(payload) {
      if (!canUseFolderBackupApi()) return false;
      try {
        const res = await fetch("/__backup", {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=utf-8" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) return false;
        const j = await res.json();
        return !!(j && j.ok);
      } catch (e) {
        console.warn("本目录备份失败（请用 打开砺行.bat）", e);
        return false;
      }
    }

    async function tryHydrateFromDirBackup() {
      if (!canUseFolderBackupApi()) return false;
      try {
        const cur = normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
        if (stateHasData(cur)) return false;
        const res = await fetch("./" + AUTO_FILE_NAME, { cache: "no-store" });
        if (!res.ok) return false;
        const wrapped = await res.json();
        const data = normalizeState(wrapped && wrapped.data ? wrapped.data : wrapped);
        if (!stateHasData(data)) return false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        localStorage.setItem(BACKUP_KEY, JSON.stringify(buildBackupPayload(data)));
        return true;
      } catch {
        return false;
      }
    }

    function scheduleDiskBackup(state) {
      const prefs = getPrefs();
      clearTimeout(_diskBackupTimer);
      _diskBackupTimer = setTimeout(async () => {
        const payload = buildBackupPayload(state);
        const text = JSON.stringify(payload, null, 2);
        let wroteFile = await writeFolderBackupViaServer(payload);
        let how = wroteFile ? "已写入本目录 " + AUTO_FILE_NAME : "";
        if (!wroteFile && _backupFileHandle) {
          wroteFile = await writeBoundBackupFile(payload);
          if (wroteFile) how = "已写入绑定文件";
        }
        // 仅显式勾选时才下载到浏览器下载目录
        if (!wroteFile && prefs.autoDownloadBackup === true) {
          downloadBlob(AUTO_FILE_NAME, new Blob([text], { type: "application/json;charset=utf-8" }));
          how = "已下载到浏览器";
        }
        if (!how) how = canUseFolderBackupApi() ? "本目录写入失败 · 仅浏览器内" : "仅浏览器内（请用 bat 打开以写入本目录）";
        _lastDiskBackupAt = nowIso();
        setPrefs({ lastDiskBackupAt: _lastDiskBackupAt });
        updateAutoBackupStatus(how);
      }, 400);
    }

    function pushHistory(stateJson) {
      try {
        const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        hist.unshift({ at: nowIso(), data: stateJson });
        localStorage.setItem(HISTORY_KEY, JSON.stringify(hist.slice(0, 5)));
      } catch (e) {
        console.warn("历史备份写入失败", e);
      }
    }

    function recoverFromAutobackup() {
      try {
        const raw = localStorage.getItem(BACKUP_KEY);
        if (!raw) return false;
        const wrapped = JSON.parse(raw);
        const data = wrapped && wrapped.data ? wrapped.data : wrapped;
        if (!stateHasData(data)) return false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizeState(data)));
        return true;
      } catch { return false; }
    }

    function migrateStorage() {
      if (!localStorage.getItem(STORAGE_KEY)) {
        for (const k of OLD_KEYS) {
          const old = localStorage.getItem(k);
          if (old) { localStorage.setItem(STORAGE_KEY, old); break; }
        }
      }
      if (!localStorage.getItem(STORAGE_KEY)) {
        if (!recoverFromAutobackup()) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(emptyState()));
        }
      } else {
        try {
          const cur = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (!stateHasData(cur)) recoverFromAutobackup();
        } catch {
          recoverFromAutobackup();
        }
      }
    }

    function loadState() {
      migrateStorage();
      try {
        return normalizeState(JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"));
      } catch { return emptyState(); }
    }

    function saveState(state, opts) {
      if (window.LixingAuth && !window.LixingAuth.canWrite()) {
        window.LixingAuth.notifyGuestBlocked();
        return;
      }
      const normalized = normalizeState(state);
      const json = JSON.stringify(normalized);
      localStorage.setItem(STORAGE_KEY, json);
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify(buildBackupPayload(normalized)));
        pushHistory(json);
      } catch (e) {
        console.warn("自动备份写入 localStorage 失败", e);
      }
      if (!opts || opts.disk !== false) scheduleDiskBackup(normalized);
    }

    /* ===== 密度 ===== */
    function calcPassivePoints(income, wage, advanced) {
      if (!wage || wage <= 0 || !income || income <= 0) return 0;
      const t = 3 * wage;
      if (!advanced) return income >= t ? 1 : 0;
      return Math.min(3, Math.floor(income / t));
    }
    function calcDensity(h, c, l, p) {
      if (!h || h <= 0) return null;
      return ((c + l + p) / h) * 100;
    }
    function entryDensity(e) {
      if (window.LixingV1 && typeof window.LixingV1.dayDensity === "function") {
        return window.LixingV1.dayDensity(e);
      }
      return e ? calcDensity(e.h, e.c, e.l, e.p) : null;
    }
    function densityTier(d) {
      if (d == null) return "na";
      if (d >= 40) return "high";
      if (d >= 15) return "mid";
      return "low";
    }
    function formatDensity(d) { return d == null ? "—" : Math.round(d) + "%"; }

    function getSettings() {
      const prev = (typeof loadState === "function" && (loadState().settings || {})) || {};
      const wageEl = document.getElementById("hourlyWage");
      const advEl = document.getElementById("advancedPassive");
      return Object.assign({}, prev, {
        hourlyWage: wageEl ? (parseFloat(wageEl.value) || 0) : (prev.hourlyWage || 0),
        advancedPassive: advEl ? !!advEl.checked : !!prev.advancedPassive,
      });
    }

    function updatePreview() {
      const hoursEl = document.getElementById("hours");
      if (!hoursEl) return;
      const h = parseFloat(hoursEl.value) || 0;
      const c = parseInt(document.getElementById("conn").value, 10) || 0;
      const l = parseInt(document.getElementById("learn").value, 10) || 0;
      let p = parseInt(document.getElementById("passive").value, 10) || 0;
      const passiveEl = document.getElementById("passive");
      if (document.getElementById("autoPassive") && document.getElementById("autoPassive").checked) {
        p = calcPassivePoints(parseFloat(document.getElementById("passiveIncome").value) || 0, getSettings().hourlyWage, getSettings().advancedPassive);
        passiveEl.value = p; passiveEl.readOnly = true;
      } else if (passiveEl) { passiveEl.readOnly = false; }
      const fields = window.LixingV1 ? window.LixingV1.getDailyFields() : {};
      const d = window.LixingV1
        ? window.LixingV1.dayDensity({ h, c, l, p, harvests: fields.harvests, harvest: fields.harvest })
        : calcDensity(h, c, l, p);
      const hero = document.getElementById("densityHero");
      if (!hero) return;
      hero.textContent = formatDensity(d);
      hero.className = "value " + densityTier(d);
    }

    function updateNotebookDateDisplay() {
      const date = document.getElementById("date").value || todayStr();
      const gregEl = document.getElementById("journalDateGreg");
      const lunarEl = document.getElementById("journalDateLunar");
      const reviewDateEl = document.getElementById("reviewCoverDate");
      const label = document.getElementById("dateWorkspaceLabel");

      let lunarLine = "";
      let issueLine = "—";

        lunarLine = window.LixingLunar.formatLunarLine(date);

      } else {

          pretty = d.toLocaleDateString("zh-CN", {
            year: "numeric", month: "long", day: "numeric", weekday: "long",
          });

          });

    function saveNotebookThree(opts) {
      const date = document.getElementById("date").value || todayStr();
      const state = loadState();
      state.entries = state.entries || {};
      const prev = state.entries[date] || {};
      const fields = window.LixingV1 ? window.LixingV1.getDailyFields() : {};
      const harvests = fields.harvests || ["", "", ""];
      const three = harvests.some(Boolean)
        ? harvests.slice()
        : (fields.three || ["", "", ""]);
      const threeKw = fields.threeKw || ["", "", ""];
      const reviewed = (fields.reviewDone || []).some((v) => v === "yes" || v === "no");
      state.entries[date] = Object.assign({}, prev, {
        dailyWish: fields.dailyWish || prev.dailyWish || "",
        three,
        threeKw,
        feeling: fields.feeling || prev.feeling || "",
        reviewDone: fields.reviewDone || prev.reviewDone || [null, null, null],
        reviewNote: fields.reviewNote || prev.reviewNote || "",
        reviewedAt: reviewed ? new Date().toISOString() : prev.reviewedAt || "",
        harvests,
        harvest: fields.harvest || harvests.filter(Boolean).join("\n"),
        thickness: fields.thickness || prev.thickness || "",
      });
      saveState(state);
      const toastId = opts && opts.toastId ? opts.toastId : "savedRecordToast";
      showToast(toastId);
      if (window.LixingV1) window.LixingV1.renderKeywords();
      if (window.LixingV1) window.LixingV1.renderHarvestPanel();
      if (window.LixingHome) window.LixingHome.updateYesterdayBanner();
      if (typeof renderDensity === "function") renderDensity();

      const state = loadState();

    function calendarDates(limit, endStr) {
      const end = endStr || todayStr();
      const [y, m, d] = end.split("-").map(Number);
      const anchor = new Date(y, m - 1, d, 12, 0, 0);
      const out = [];
      for (let i = limit - 1; i >= 0; i--) {
        const cur = new Date(anchor);
        cur.setDate(cur.getDate() - i);
        out.push(
          cur.getFullYear() + "-" +
          String(cur.getMonth() + 1).padStart(2, "0") + "-" +
          String(cur.getDate()).padStart(2, "0")
        );
      }
      return out;
    }

    function sortedDates(entries, limit) { return calendarDates(limit); }

    function renderStats(entries) {
      const statsEl = document.getElementById("stats");
      if (!statsEl) return;
      const dates = sortedDates(entries, 7);
      let sumD = 0, countD = 0, highDays = 0;
      dates.forEach((d) => {
        const e = entries[d];
        if (!e) return;
        const dens = entryDensity(e);
        if (dens == null) return;
        sumD += dens; countD++;
        if (dens >= 40) highDays++;
      });
      const avg = countD ? Math.round(sumD / countD) : "—";
      statsEl.innerHTML = `
        <div class="item"><div class="num">${avg}${avg !== "—" ? "%" : ""}</div><div class="lbl">近7天均密度</div></div>
        <div class="item"><div class="num">${highDays}</div><div class="lbl">高密度日 ≥40%</div></div>
        <div class="item"><div class="num">${Object.keys(entries).length}</div><div class="lbl">累计记录天</div></div>`;
    }

    function renderTable(entries) {
      const dates = sortedDates(entries, 14);
      const table = document.getElementById("mainTable");
      const empty = document.getElementById("emptyTable");
      if (!table) return;
      if (!dates.length) { table.hidden = true; if (empty) empty.hidden = false; return; }
      table.hidden = false; if (empty) empty.hidden = true;
      const header = document.getElementById("dateHeader");
      const body = document.getElementById("tableBody");
      if (!header || !body) return;
      header.innerHTML = "<th>指标</th>" + dates.map((d) => `<th>${d.slice(5)}</th>`).join("");
      const rows = [
        { label: "H 劳动时长", key: "h" }, { label: "C 主动连接", key: "c" },
        { label: "L 有效学习", key: "l" }, { label: "P 被动收入", key: "p" }, { label: "D 自省", key: "d" },
      ];
      body.innerHTML = rows.map((row) => {
        const cells = dates.map((d) => {
          const e = entries[d];
          if (!e) return "<td>—</td>";
          if (row.key === "d") {
            const dens = entryDensity(e);
            if (dens == null) return "<td>—</td>";
            return `<td class="d-${densityTier(dens)}">${formatDensity(dens)}</td>`;
          }
          return `<td>${e[row.key] ?? "—"}</td>`;
        }).join("");
        return `<tr><td>${row.label}</td>${cells}</tr>`;
      }).join("");
    }

    function renderDensity() {
      const entries = loadState().entries || {};
      renderStats(entries); renderTable(entries);
      if (window.LixingV1) window.LixingV1.renderKeywords();
    }

    function exportCsv() {
      const entries = loadState().entries || {};
      const lines = ["日期,H,C,L,P,产出分,密度%,备注"];
      Object.keys(entries).sort().forEach((d) => {
        const e = entries[d];
        const dens = entryDensity(e);
        const densCell = dens == null ? "" : Math.round(dens * 10) / 10;
        const note = (e.harvest || (e.harvests || []).filter(Boolean).join(" / ") || e.note || "").replace(/"/g,'""');
        lines.push(`${d},${e.h||0},${e.c||0},${e.l||0},${e.p||0},${(e.c||0)+(e.l||0)+(e.p||0)},${densCell},"${note}"`);
      });
      downloadBlob("life-density-" + todayStr() + ".csv", new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
    }

    function importCsv(text) {
      const state = loadState();
      state.entries = state.entries || {};
      text.trim().split(/\r?\n/).slice(1).forEach((line) => {
        const parts = line.match(/(".*?"|[^,]+)(?=,|$)/g);
        if (!parts || parts.length < 6) return;
        const clean = (s) => s.replace(/^"|"$/g, "").replace(/""/g, '"');
        const [date, h, c, l, p, , , noteRaw] = parts.map(clean);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
        state.entries[date] = { h: +h||0, c: +c||0, l: +l||0, p: +p||0, passiveIncome: 0, note: noteRaw||"" };
      });
      saveState(state); renderDensity(); loadTodayForm();
    }

    /** 一键备份：六 Tab + 设置全部写入 JSON 文件 */

      const payload = buildBackupPayload(loadState());
      payload.auto = false;

      setPrefs({ lastDiskBackupAt: _lastDiskBackupAt });
      updateAutoBackupStatus("手动备份完成");
      showToast("savedToast");

    function normalizeBackupData(raw) {
      // 兼容：整包 { app, data }、或直接就是 state 对象
      let data = raw;
      if (raw && typeof raw === "object" && raw.data && typeof raw.data === "object") data = raw.data;
      if (!data || typeof data !== "object") throw new Error("不是有效的备份文件");
      const next = emptyState();
      if (data.entries && typeof data.entries === "object") next.entries = data.entries;
      if (Array.isArray(data.opinions)) next.opinions = data.opinions;
      if (Array.isArray(data.industries)) next.industries = data.industries;
      if (Array.isArray(data.rationals)) next.rationals = data.rationals;
      if (Array.isArray(data.samplings)) next.samplings = data.samplings;
      if (Array.isArray(data.reflections)) next.reflections = data.reflections;
      if (Array.isArray(data.penetrations)) next.penetrations = data.penetrations;
      if (Array.isArray(data.dualCards)) next.dualCards = data.dualCards;
      if (data.biasSpots && typeof data.biasSpots === "object") next.biasSpots = data.biasSpots;
      if (data.leonMarks && typeof data.leonMarks === "object") next.leonMarks = data.leonMarks;
      if (data.wheel && typeof data.wheel === "object") next.wheel = data.wheel;
      if (Array.isArray(data.wheelSnaps)) next.wheelSnaps = data.wheelSnaps;
      if (data.kpi && typeof data.kpi === "object") next.kpi = data.kpi;
      if (Array.isArray(data.kpiSnaps)) next.kpiSnaps = data.kpiSnaps;
      if (data.indSteps && typeof data.indSteps === "object") next.indSteps = data.indSteps;
      if (data.settings && typeof data.settings === "object") next.settings = data.settings;
      const nDays = Object.keys(next.entries).length;
      const nOther = next.opinions.length + next.industries.length + next.rationals.length
        + next.samplings.length + next.reflections.length
        + next.penetrations.length + next.dualCards.length
        + Object.keys(next.biasSpots).length + Object.keys(next.leonMarks).length
        + (next.wheelSnaps || []).length + (next.kpiSnaps || []).length;
      if (nDays === 0 && nOther === 0 && !Object.keys(next.settings).length) {
        throw new Error("备份里没有可恢复的数据");
      }
      return { next, nDays, nOther };
    }

    function readSampleRow(tr) {

    function detectIdeaStage(elite, youth, elder) {
      const norm = (g) => ({ a: g.agree / 10, d: g.disagree / 10, u: g.unknown / 10 });
      const e = norm(elite), y = norm(youth), o = norm(elder);
      if (e.a >= 0.7 && y.a >= 0.7 && o.a >= 0.6)
        return { label: "刻舟求剑", text: "三组普遍接受 — 该退了 / 入场性价比低", tier: "low" };
      if (e.a >= 0.4 && y.u >= 0.5 && o.a <= 0.3)
        return { label: "机会期", text: "精英接受 · 年轻人未知 · 大众未共识 — 开始入场", tier: "high" };
      if (e.a >= 0.5 && y.a >= 0.4 && o.a >= 0.2)
        return { label: "成熟期", text: "各层均有认知 — 最后入场机会", tier: "mid" };
      return { label: "过渡/待采样", text: "继续补足 30 人采样或数据不足", tier: "mid" };
    }

    function updateSamplePreview() {
      const rows = document.querySelectorAll("#sampleBody tr");
      const groups = {};
      rows.forEach((tr) => {
        const g = readSampleRow(tr);
        tr.querySelector(".s-sum").textContent = g.agree + g.disagree + g.unknown;
        groups[tr.dataset.group] = g;
      });
      const stage = detectIdeaStage(groups.elite, groups.youth, groups.elder);
      document.getElementById("stageHero").textContent = stage.label;
      document.getElementById("stageHero").className = "value " + stage.tier;
      document.getElementById("stageVerdict").textContent = stage.text;
      document.getElementById("stageVerdict").className = "verdict " + stage.tier;

      const labels = { elite: "精英", youth: "年轻人", elder: "大爷大妈" };
      document.getElementById("sampleChart").innerHTML = ["elite","youth","elder"].map((k) => {
        const g = groups[k];
        const t = g.agree + g.disagree + g.unknown || 1;
        return `<div class="bar-col"><div class="bar-stack">
          ${g.agree ? `<span class="bar-agree" style="height:${g.agree/t*100}%"></span>` : ""}
          ${g.disagree ? `<span class="bar-disagree" style="height:${g.disagree/t*100}%"></span>` : ""}
          ${g.unknown ? `<span class="bar-unknown" style="height:${g.unknown/t*100}%"></span>` : ""}
        </div><div class="lbl">${labels[k]}</div></div>`;
      }).join("");
      return { groups, stage };
    }

    const PEN_CAPS = ["define", "break", "leverage", "decide", "iterate", "own"];
    const PEN_MINDSET = {
      know: "会不会",
      can: "能不能",
      mix: "切换中",
    };

    function getPenCaps() {
      const scores = {};
      const notes = {};
      PEN_CAPS.forEach((k) => {
        const sel = document.querySelector(`[data-pen-cap="${k}"]`);
        const ta = document.querySelector(`[data-pen-note="${k}"]`);
        scores[k] = parseInt(sel?.value, 10) || 3;
        notes[k] = (ta?.value || "").trim();
      });
      return { scores, notes };
    }

    function penAvg(scores) {
      const vals = PEN_CAPS.map((k) => scores[k] || 0);
      return vals.reduce((a, b) => a + b, 0) / vals.length;
    }

    function penTier(avg) {
      if (avg == null || Number.isNaN(avg)) return "na";
      if (avg >= 4) return "high";
      if (avg >= 3) return "mid";
      return "low";
    }

    function penVerdictText(avg, mindset) {
      const t = penTier(avg);
      let base = t === "high" ? "穿透力较强 · 盯住最弱一项继续放大结果"
        : t === "mid" ? "及格线附近 · 优先补「定义 / 借力 / ownership」短板"
        : "偏考试思维 · 本周只做一件可验证的事";
      if (mindset === "know") base += " · 注意：当前默认还是「会不会」";
      return base;
    }

      hero.className = "value " + penTier(avg);

      verdict.className = "verdict " + penTier(avg);
    }

    /* ===== 10 生命之轮 + 三课 ===== */
    let leonFilterSrc = "all";
    let wheelSpokeId = "physical";
    let wheelOverlayId = null;
    let wheelDragging = null;

    function getWheelBook() {
      return window.WHEEL_OF_LIFE || { spokes: [], pillars: [], max: 10, sample: {} };
    }
    function wheelSpokes() { return getWheelBook().spokes || []; }
    function wheelSpokeById(id) {
      return wheelSpokes().find((s) => s.id === id) || wheelSpokes()[0] || { id: "physical", zh: "", en: "", desc: "" };
    }
    function wheelPillarById(id) {
      return (getWheelBook().pillars || []).find((p) => p.id === id) || { color: "#d97706", zh: "" };
    }
    function defaultWheelScores() {
      const o = {};
      wheelSpokes().forEach((s) => { o[s.id] = 0; });
      return o;
    }
    function getWheelScores() {
      return Object.assign(defaultWheelScores(), (loadState().wheel && loadState().wheel.scores) || {});
    }
    function getWheelNote() {
      return (loadState().wheel && loadState().wheel.note) || "";
    }
    function saveWheelScores(scores, extra) {
      const st = loadState();
      st.wheel = {
        scores: Object.assign(defaultWheelScores(), scores),
        note: extra && extra.note != null ? extra.note : getWheelNote(),
        updatedAt: nowIso(),
      };
      saveState(st);
    }
    function setWheelScore(id, value) {
      const scores = getWheelScores();
      scores[id] = Math.max(0, Math.min(10, Math.round(Number(value) || 0)));
      saveWheelScores(scores);
      renderWheel({ sliders: false });
    }
    function wheelAvg(scores) {
      const arr = wheelSpokes().map((s) => Number(scores[s.id]) || 0);
      if (!arr.length) return 0;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }
    function wheelRange(scores) {
      const arr = wheelSpokes().map((s) => Number(scores[s.id]) || 0);
      return { min: Math.min(...arr), max: Math.max(...arr) };
    }
    function wheelRoundLabel(scores) {
      const { min, max } = wheelRange(scores);
      const gap = max - min;
      if (arrAllZero(scores)) return "尚未打分";
      if (gap <= 2) return "较圆";
      if (gap <= 4) return "略扁";
      return "缺口明显";
    }
    function arrAllZero(scores) {
      return wheelSpokes().every((s) => !(Number(scores[s.id]) > 0));
    }
    function wheelLowest(scores) {
      return [...wheelSpokes()].sort((a, b) => (scores[a.id] || 0) - (scores[b.id] || 0)).slice(0, 2);
    }
    function wheelPt(deg, r, cx, cy) {
      const a = (deg - 90) * Math.PI / 180;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    function wheelDeg(i, n) { return (i / n) * 360; }
    function wheelPolyPoints(scores, cx, cy, rMax, minR) {
      const list = wheelSpokes();
      const n = list.length || 1;
      return list.map((s, i) => {
        const v = Math.max(0, Math.min(10, Number(scores[s.id]) || 0));
        const r = minR + (rMax - minR) * (v / 10);
        return wheelPt(wheelDeg(i, n), r, cx, cy).join(",");
      }).join(" ");
    }
    function wheelArc(cx, cy, r, d0, d1) {
      const p0 = wheelPt(d0, r, cx, cy);
      const p1 = wheelPt(d1, r, cx, cy);
      return `M ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A ${r} ${r} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
    }
    function wheelMiniSvg(scores, size) {
      const cx = size / 2, cy = size / 2, r = size * 0.36, minR = 4;
      const pts = wheelPolyPoints(scores, cx, cy, r, minR);
      const n = wheelSpokes().length;
      let axes = "";
      for (let i = 0; i < n; i++) {
        const p = wheelPt(wheelDeg(i, n), r, cx, cy);
        axes += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#e6e2db" stroke-width="0.8"/>`;
      }
      return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">${axes}<polygon points="${pts}" fill="rgba(15,118,110,0.22)" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
    }

    function renderWheel(opts) {
      renderWheelSvg();

      renderWheelDetail();
      if (!opts || opts.sliders !== false) renderWheelSliders();

      renderWheelHistory();

    function renderWheelLegend() {
      const el = document.getElementById("wheelLegend");
      if (!el) return;
      el.innerHTML = (getWheelBook().pillars || []).map((p) =>

    function renderWheelSvg() {
      const host = document.getElementById("wheelSvg");
      if (!host) return;
      const book = getWheelBook();
      const list = wheelSpokes();
      const n = list.length || 1;
      const scores = getWheelScores();
      const overlay = (loadState().wheelSnaps || []).find((s) => s.id === wheelOverlayId);
      const cx = 360, cy = 360, rMax = 198, minR = 16, labelR = 262;
      let rings = "";
      for (let k = 2; k <= 10; k += 2) {
        const rr = minR + (rMax - minR) * (k / 10);
        rings += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${k === 10 ? "#d9d1c4" : "#ebe4d8"}" stroke-width="${k === 10 ? 1.4 : 1}"/>`;
      }
      const pillarArcs = [
        { id: "health", d0: -20, d1: 100 },
        { id: "wealth", d0: 100, d1: 220 },
        { id: "happiness", d0: 220, d1: 340 },
      ].map((a) => {
        const col = wheelPillarById(a.id).color;
        return `<path d="${wheelArc(cx, cy, 214, a.d0, a.d1)}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" opacity="0.9"/>`;
      }).join("");
      let axes = "";
      let labels = "";
      let handles = "";
      list.forEach((s, i) => {
        const deg = wheelDeg(i, n);
        const pEdge = wheelPt(deg, rMax, cx, cy);
        const pLab = wheelPt(deg, labelR, cx, cy);
        const on = s.id === wheelSpokeId;
        const col = wheelPillarById(s.pillar).color;
        const v = Math.max(0, Math.min(10, Number(scores[s.id]) || 0));
        const r = minR + (rMax - minR) * (v / 10);
        const pH = wheelPt(deg, r, cx, cy);
        const aRad = (deg - 90) * Math.PI / 180;
        const anchor = Math.cos(aRad) > 0.35 ? "start" : Math.cos(aRad) < -0.35 ? "end" : "middle";
        axes += `<line data-wheel-spoke="${esc(s.id)}" x1="${cx}" y1="${cy}" x2="${pEdge[0]}" y2="${pEdge[1]}" stroke="${on ? col : "#ddd6c8"}" stroke-width="${on ? 2.4 : 1}" />`;
        axes += `<line data-wheel-spoke="${esc(s.id)}" x1="${cx}" y1="${cy}" x2="${pEdge[0]}" y2="${pEdge[1]}" stroke="transparent" stroke-width="18" />`;
        labels += `<text data-wheel-spoke="${esc(s.id)}" x="${pLab[0].toFixed(1)}" y="${pLab[1].toFixed(1)}" text-anchor="${anchor}" font-size="${on ? 13 : 12}" font-weight="${on ? 700 : 600}" fill="${on ? "#111" : "#333"}" style="cursor:pointer">
          <tspan x="${pLab[0].toFixed(1)}" dy="0">${esc(s.zh)}</tspan>
          <tspan x="${pLab[0].toFixed(1)}" dy="14" font-size="10" font-weight="400" fill="#8a8175">${esc(s.en)}</tspan>
        </text>`;
        handles += `<circle data-wheel-handle="${esc(s.id)}" cx="${pH[0].toFixed(1)}" cy="${pH[1].toFixed(1)}" r="${on ? 8.5 : 6.5}" fill="#fff" stroke="${col}" stroke-width="2.6" style="cursor:grab"/>`;
      });
      const pts = wheelPolyPoints(scores, cx, cy, rMax, minR);
      const overPts = overlay ? wheelPolyPoints(overlay.scores || {}, cx, cy, rMax, minR) : "";
      const avg = wheelAvg(scores);
      host.innerHTML = `<svg viewBox="0 0 720 720" role="img" aria-label="生命之轮九维雷达">
        <defs>
          <linearGradient id="wheelFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f766e" stop-opacity="0.30"/>
            <stop offset="55%" stop-color="#d97706" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#9f1239" stop-opacity="0.28"/>
          </linearGradient>
        </defs>
        ${rings}${pillarArcs}${axes}
        ${overPts ? `<polygon points="${overPts}" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" opacity="0.75" stroke-linejoin="round"/>` : ""}
        <polygon points="${pts}" fill="url(#wheelFill)" stroke="#111" stroke-width="2.3" stroke-linejoin="round"/>
        ${handles}
        <circle cx="${cx}" cy="${cy}" r="48" fill="#fffdf8" stroke="#e6e2db"/>
        <text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="22" font-weight="700" font-family="Georgia, serif">${arrAllZero(scores) ? "—" : avg.toFixed(1)}</text>
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="11" fill="#6b6b6b">均分 · ${esc(wheelRoundLabel(scores))}</text>
        ${labels}
      </svg>`;
    }

    function scoreFromPointer(ev, spokeId) {
      const svg = document.querySelector("#wheelSvg svg");
      if (!svg) return null;
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const ctm = svg.getScreenCTM();
      if (!ctm) return null;
      const loc = pt.matrixTransform(ctm.inverse());
      const cx = 360, cy = 360, rMax = 198, minR = 16;
      const dx = loc.x - cx, dy = loc.y - cy;
      const dist = Math.hypot(dx, dy);
      if (spokeId) {
        const v = Math.round(((dist - minR) / (rMax - minR)) * 10);
        return { id: spokeId, value: Math.max(0, Math.min(10, v)) };
      }
      let ang = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      if (ang < 0) ang += 360;
      const n = wheelSpokes().length;
      const i = Math.round(ang / (360 / n)) % n;
      const v = Math.round(((dist - minR) / (rMax - minR)) * 10);
      return { id: wheelSpokes()[i].id, value: Math.max(0, Math.min(10, v)) };
    }

          <div class="cap-head"><span class="cap-name">${p.zh} · ${p.en}</span></div>
          <div class="kpi-score-row">
            <input type="range" min="0" max="10" step="1" id="kpiScore-${p.id}" value="${v}" />
            <span class="kpi-n" id="kpiScoreN-${p.id}">${v}</span>
          </div>
        </div>`;
      }).join("");
      wrap.querySelectorAll("input[type=range]").forEach((inp) => {
        inp.addEventListener("input", () => {
          const id = inp.id.replace("kpiScore-", "");
          const n = document.getElementById("kpiScoreN-" + id);
          if (n) n.textContent = inp.value;
          renderKpiStats();
        });
      });
    }

    function renderKpiStats() {
      const el = document.getElementById("kpiStats");
      if (!el) return;
      const scores = {};
      KPI_PS.forEach((p) => {
        const inp = document.getElementById("kpiScore-" + p.id);
        scores[p.id] = inp ? Number(inp.value) || 0 : Number((getKpi().scores || {})[p.id]) || 0;
      });
      const vals = KPI_PS.map((p) => scores[p.id]);
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      const minV = Math.min(...vals);
      const maxV = Math.max(...vals);
      const gap = maxV - minV;
      const lowest = KPI_PS.filter((p) => scores[p.id] === minV).map((p) => p.zh).join("、");
      el.innerHTML = `
        <div class="item"><div class="num">${avg.toFixed(1)}</div><div class="lbl">五维均分</div></div>
        <div class="item"><div class="num">${gap}</div><div class="lbl">最高−最低</div></div>
        <div class="item"><div class="num">${minV}</div><div class="lbl">最弱 ${esc(lowest)}</div></div>
        <div class="item"><div class="num">${(loadState().kpiSnaps || []).length}</div><div class="lbl">快照</div></div>`;
    }

    function renderKpiHistory() {
      const el = document.getElementById("kpiHistory");
      if (!el) return;
      const list = loadState().kpiSnaps || [];
      if (!list.length) {
        el.innerHTML = '<div class="empty-table">还没有快照。打完分后点「存一版快照」。</div>';
        return;
      }
      el.innerHTML = list.map((s) => {
        const bits = KPI_PS.map((p) => `${p.zh}${(s.scores && s.scores[p.id]) || 0}`).join(" · ");
        return `<div class="record-item">
          <div><strong>${esc(s.niche || "未写利基")} · 均 ${s.avg}</strong>
            <div class="meta">${s.at} · ${esc(bits)}</div>
            ${s.note ? `<div class="meta">${esc(s.note)}</div>` : ""}
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn btn-ghost" data-kpi-load="${s.id}">载入</button>
            <button type="button" class="btn-danger" data-kpi-del="${s.id}">删</button>
          </div>
        </div>`;
      }).join("");
    }

    function renderKpiPanel() {
      fillKpiForm(getKpi());
      renderKpiSliders();
      fillKpiForm(getKpi());
      renderKpiStats();
      renderKpiHistory();
    }

    document.getElementById("saveKpiBtn")?.addEventListener("click", saveKpiCurrent);
    document.getElementById("snapKpiBtn")?.addEventListener("click", snapKpi);
    document.getElementById("clearKpiBtn")?.addEventListener("click", () => {
      if (confirm("清空当前影响力表？（快照仍保留）")) clearKpiForm();
    });
    document.getElementById("kpiHistory")?.addEventListener("click", (e) => {
      const del = e.target.closest("[data-kpi-del]");
      if (del) {
        const st = loadState();
        st.kpiSnaps = (st.kpiSnaps || []).filter((s) => s.id !== del.dataset.kpiDel);
        saveState(st);
        renderKpiHistory();
        renderKpiStats();
        return;
      }
      const load = e.target.closest("[data-kpi-load]");
      if (!load) return;
      const snap = (loadState().kpiSnaps || []).find((s) => s.id === load.dataset.kpiLoad);
      if (!snap) return;
      const st = loadState();
      st.kpi = Object.assign(getKpi(), { scores: { ...snap.scores }, niche: snap.niche || st.kpi.niche, note: snap.note || "" });
      saveState(st);
      renderKpiPanel();
    });
    }

    (async function boot() {
      migrateStorage();
      const hydrated = await tryHydrateFromDirBackup();
      if (hydrated) updateAutoBackupStatus("已从本目录备份恢复");
      else if (canUseFolderBackupApi()) updateAutoBackupStatus("本目录自动备份已就绪");
      loadTodayForm();
      if (window.LixingV1) window.LixingV1.init();
      if (window.LixingWriteDialog) window.LixingWriteDialog.syncPreviews();
    })();
  </script>
</body>
</html>

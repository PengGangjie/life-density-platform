<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>扫码打开 · 砺行 · 日省</title>
  <link rel="icon" href="assets/brand-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/lixing-daily.css?v=20260828ac" />
  <style>
    body.qr-page {
      margin: 0;
      min-height: 100vh;
      background: #0e0c0a;
      color: #f3ead8;
      font-family: "GuoWen ZhengKai", "KaiTi", "STKaiti", serif;
    }
    .qr-shell {
      max-width: min(480px, 92vw);
      margin: 0 auto;
      padding: 24px 16px 40px;
      text-align: center;
    }
    .qr-head h1 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      letter-spacing: 0.32em;
      font-weight: 600;
    }
    .qr-head p {
      margin: 0 0 20px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: rgba(196, 176, 138, 0.82);
      line-height: 1.7;
    }
    .qr-grid {
      display: grid;
      gap: 16px;
    }
    .qr-card {
      padding: 16px 14px 18px;
      border: 1px solid rgba(243, 234, 216, 0.14);
      background: rgba(12, 10, 8, 0.55);
      backdrop-filter: blur(6px);
    }
    .qr-card h2 {
      margin: 0 0 12px;
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      font-weight: 600;
      color: rgba(232, 160, 160, 0.9);
    }
    .qr-card img {
      display: block;
      width: min(220px, 72vw);
      height: auto;
      margin: 0 auto 10px;
      border: 6px solid #f3ead8;
      border-radius: 2px;
      background: #f3ead8;
    }
    .qr-card .url {
      margin: 0;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: rgba(196, 176, 138, 0.75);
      word-break: break-all;
    }
    .qr-foot {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .qr-foot a {
      color: rgba(196, 176, 138, 0.9);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      padding: 8px 14px;
      border: 1px solid rgba(243, 234, 216, 0.22);
    }
    .qr-foot a:hover {
      color: #f3ead8;
      border-color: rgba(243, 234, 216, 0.45);
    }
  </style>
</head>
<body class="qr-page auth-pending daily-page home-scene-page">
  <nav class="topnav app-banner" aria-label="主导航">
    <a class="brand brand--banner" href="index.html" aria-label="砺行 · 日省">
      <img class="brand-logo" src="assets/brand-logo.png" alt="" width="34" height="34" decoding="async" onerror="this.hidden=true" />
      <span class="brand-wordmark"><span class="char-li">砺</span>行 · 日省</span>
    </a>
    <div class="topnav-auth">
      <a class="tool-link" href="index.html">返回</a>
    </div>
  </nav>

  <main class="qr-shell">
    <header class="qr-head">
      <h1>手机扫码</h1>
      <p>微信 / 系统相机扫一扫，即可打开线上版。<br />主页写日省；工具台可阅览十二模块。</p>
    </header>

    <div class="qr-grid">
      <article class="qr-card">
        <h2>主页 · 抉择 / 行动 / 愿想</h2>
        <img src="assets/lixing-qr-home.png" width="220" height="220" alt="砺行主页二维码" decoding="async" />
        <p class="url">https://life-density.ai-builders.space/</p>
      </article>
      <article class="qr-card">
        <h2>工具台 · 十二模块</h2>
        <img src="assets/lixing-qr-workspace.png" width="220" height="220" alt="砺行工具台二维码" decoding="async" />
        <p class="url">https://life-density.ai-builders.space/workspace.html</p>
      </article>
    </div>

    <footer class="qr-foot">
      <a href="index.html">打开主页</a>
      <a href="workspace.html">打开工具台</a>
    </footer>
  </main>

  <script src="assets/lixing-cloud-auth.js"></script>
</body>
</html>
